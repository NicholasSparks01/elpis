<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Elpis Help</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="theme.css" />
<style>
  /* the Help window: contents on the left, the page in the middle, "on this page" on the right */
  body { display: grid; grid-template-columns: 272px minmax(0, 1fr) 224px; height: 100vh; overflow: hidden; }
  #side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 14px 14px 10px; display: flex; align-items: center; gap: 10px; }
  .side-top img { width: 26px; height: 26px; border-radius: 6px; }
  .side-top b { font-size: 15px; font-weight: 600; flex: 1; }
  #theme { padding: 3px 7px; font-size: 13px; line-height: 1; background: transparent; border-color: transparent; color: var(--dim); }
  .searchwrap { padding: 0 12px 10px; }
  #q { width: 100%; }
  #contents { overflow-y: auto; overflow-x: hidden; flex: 1; padding: 0 8px 16px; }
  .group { padding: 14px 8px 4px; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .page-link, .sub-link { white-space: normal; line-height: 1.35; }
  .page-link { display: block; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 6px; background: none; padding: 5px 10px; color: var(--fg); font-size: 13px; }
  .page-link:hover { background: var(--raised); border-color: transparent; }
  .page-link.current { background: var(--raised); border-color: var(--border); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent-text); }
  .subs { margin: 2px 0 6px 12px; border-left: 1px solid var(--border); }
  .sub-link { display: block; width: 100%; text-align: left; border: none; background: none; padding: 2px 10px; color: var(--dim); font-size: 12px; border-radius: 0; }
  .sub-link:hover { color: var(--fg); background: none; }

  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .bar button { padding: 3px 10px; font-size: 14px; line-height: 1.2; }
  #crumb { margin-left: 8px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scroller { flex: 1; overflow-y: auto; min-height: 0; }
  #content { max-width: 800px; margin: 0 auto; padding: 26px 30px 80px; line-height: 1.65; font-size: 14px; }

  /* the documentation text */
  #content h1 { font-size: 26px; font-weight: 600; margin: 0 0 14px; line-height: 1.25; }
  #content h2 { font-size: 19px; font-weight: 600; margin: 34px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); scroll-margin-top: 14px; }
  #content h3 { font-size: 15.5px; font-weight: 600; margin: 26px 0 8px; scroll-margin-top: 14px; }
  #content h4 { font-size: 14px; font-weight: 600; margin: 20px 0 6px; scroll-margin-top: 14px; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 10px 0; padding-left: 24px; }
  #content li { margin: 4px 0; }
  #content li > p { margin: 4px 0; }
  #content code { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  #content pre { position: relative; background: var(--well); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
  #content pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  #content pre .copy { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 1px 8px; opacity: 0; }
  #content pre:hover .copy, #content pre .copy:focus-visible { opacity: 1; }
  #content blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--accent-text); background: var(--panel); border-radius: 0 6px 6px 0; color: var(--fg); }
  #content blockquote p { margin: 6px 0; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  #content .table-wrap { overflow-x: auto; margin: 12px 0; }
  #content table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); font-size: 13px; }
  #content th, #content td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  #content th { background: var(--panel); color: var(--fg); font-size: 12px; white-space: nowrap; }
  #content tr:last-child td { border-bottom: none; }
  #content a.doc-link, #content a.in-page { color: var(--accent-text); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent-text) 40%, transparent); cursor: pointer; }
  #content a.doc-link:hover, #content a.in-page:hover { border-bottom-color: var(--accent-text); }
  #content .ref { font-family: "Cascadia Mono", "Cascadia Code", "Consolas", monospace; font-size: 12.5px; color: var(--dim); }
  #content .ext { border-bottom: 1px dotted var(--dim); }
  #content .ext-url { color: var(--dim); font-size: 12px; word-break: break-all; }
  #content .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent-text) 28%, transparent); } to { background: transparent; } }
  #content .footer-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); }

  /* search results */
  .results h1 { font-size: 20px; }
  .hit { display: block; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 10px 14px; margin: 8px 0; line-height: 1.5; }
  .hit:hover, .hit:focus-visible { border-color: var(--accent-text); }
  .hit .where { font-weight: 600; font-size: 13px; color: var(--fg); }
  .hit .group { padding: 0; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--dim); margin-left: 6px; display: inline; }
  .hit .snip { color: var(--dim); font-size: 12.5px; margin-top: 2px; white-space: normal; }
  mark { background: color-mix(in srgb, var(--yellow) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
  .none { color: var(--dim); }

  /* on this page */
  #toc { border-left: 1px solid var(--border); padding: 18px 14px; overflow-y: auto; font-size: 12px; }
  #toc .t { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
  #toc button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 3px 8px; color: var(--dim); border-left: 2px solid transparent; border-radius: 0; white-space: normal; line-height: 1.4; }
  #toc button.l3 { padding-left: 18px; }
  #toc button:hover { color: var(--fg); background: none; }
  #toc button.on { color: var(--fg); border-left-color: var(--accent-text); }

  @media (max-width: 1100px) { body { grid-template-columns: 250px minmax(0, 1fr); } #toc { display: none; } }
  @media (max-width: 760px) { body { grid-template-columns: 200px minmax(0, 1fr); } #content { padding: 18px 16px 60px; } }
</style>
</head>
<body>
  <aside id="side">
    <div class="side-top">
      <img src="logo.png" alt="" />
      <b>Help</b>
      <button id="theme" title="Theme" aria-label="Theme">◐</button>
    </div>
    <div class="searchwrap"><input type="text" id="q" placeholder="Search help   ( / )" aria-label="Search help" autocomplete="off" spellcheck="false" /></div>
    <nav id="contents" aria-label="Contents"></nav>
  </aside>

  <section id="main">
    <div class="bar">
      <button id="back" disabled title="Back (Alt+←)" aria-label="Back">←</button>
      <button id="fwd" disabled title="Forward (Alt+→)" aria-label="Forward">→</button>
      <div id="crumb"></div>
    </div>
    <div id="scroller"><article id="content"></article></div>
  </section>

  <aside id="toc" aria-label="On this page"></aside>
  <script src="help.js"></script>
</body>
</html>
