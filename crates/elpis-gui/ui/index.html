<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>elpis</title>
<style>
  :root {
    --bg: #1a1b26; --panel: #1f2335; --panel2: #24283b; --border: #2a2e45;
    --fg: #c0caf5; --dim: #565f89; --accent: #7aa2f7; --green: #9ece6a;
    --red: #f7768e; --yellow: #e0af68; --cyan: #7dcfff; --magenta: #bb9af7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 260px 1fr; height: 100vh;
  }
  [hidden] { display: none !important; }
  code, .mono { font-family: "Cascadia Code", "Consolas", monospace; font-size: 12px; }

  /* sidebar: the boxes */
  #sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px; font-weight: 600; font-size: 15px; letter-spacing: .3px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  #vmlist { overflow-y: auto; flex: 1; padding: 6px; }
  .vm { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
  .vm:hover { background: var(--panel2); }
  .vm.active { background: var(--panel2); border-color: var(--accent); }
  .vm .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .vm .state { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .vm.running .state { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .vm .path { color: var(--dim); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vm .from { color: var(--green); font-size: 10px; margin-left: auto; }
  .sidefoot { padding: 10px; border-top: 1px solid var(--border); color: var(--dim); font-size: 11px; }

  /* main: tabs and views */
  #main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--dim); font-size: 13px; }
  .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs button:hover:not(:disabled) { color: var(--fg); border-color: transparent; border-bottom-color: var(--accent); }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 14px; flex: 1; min-width: 150px; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 13px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1a1b26; border-color: var(--accent); font-weight: 600; }
  button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  button.small { padding: 2px 9px; font-size: 11px; }
  input[type=text], select, textarea {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; font-family: inherit; font-size: 12px;
  }
  input[type=text]:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .field { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 11px; }
  .field input { width: 64px; padding: 4px 7px; }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: "Cascadia Code", "Consolas", monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; min-height: 0; }
  .ln { display: flex; gap: 8px; }
  .ln .t { color: var(--dim); flex: none; }
  .ln .g { flex: none; }
  .white{color:#c0caf5}.gray{color:#9aa5ce}.red{color:var(--red)}.yellow{color:var(--yellow)}
  .green{color:var(--green)}.darkgreen{color:#73a857}.cyan{color:var(--cyan)}.darkcyan{color:#4a9fc7}
  .magenta{color:var(--magenta)}.blue{color:var(--accent)}.darkyellow{color:#c99a4e}
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--border); color: var(--dim); }

  /* trust badges and chips */
  .tb { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; border: 1px solid var(--border); }
  .tb.good { color: var(--green); border-color: #3d5a2e; background: #1f2b1d; }
  .tb.warn { color: var(--yellow); border-color: #5c4a28; background: #2b2619; }
  .tb.bad  { color: var(--red); border-color: #6a2f3b; background: #2e1b21; }
  .tb.dim  { color: var(--dim); }

  /* capsules view */
  .scroll { overflow-y: auto; min-height: 0; }
  .searchbar { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
  .searchbar input[type=text].q { flex: 1; min-width: 160px; }
  .progress { padding: 4px 16px; color: var(--yellow); font-size: 11px; min-height: 22px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 11px; color: var(--dim); padding: 6px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel); }
  tr.row.sel td { background: var(--panel2); }
  tr.row:focus-visible { outline: 1px solid var(--accent); }
  td.desc { color: var(--dim); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .split { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #captable { max-height: 38%; flex: none; border-bottom: 1px solid var(--border); }
  #capdetail { flex: 1; padding: 14px 16px; }
  .dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .dhead h3 { margin: 0; font-size: 15px; }
  .dhead .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .card h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .summary { white-space: pre-wrap; word-break: break-word; font-family: "Cascadia Code", "Consolas", monospace; font-size: 12px; }
  .check { display: flex; gap: 8px; margin: 2px 0; }
  .check .mark { flex: none; font-weight: 600; width: 38px; }
  .check .mark.ok { color: var(--green); } .check .mark.fail { color: var(--red); }
  .sig { margin: 6px 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .verdict { margin-top: 8px; font-weight: 600; }
  .note { color: var(--dim); font-size: 11px; }
  .hit { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
  .hit .body { flex: 1; min-width: 0; }
  .hit .ref { font-weight: 600; word-break: break-all; }

  /* a narrow window: a slimmer sidebar, and the Capsule list keeps only what decides things */
  @media (max-width: 860px) {
    body { grid-template-columns: 200px 1fr; }
    #captable th:nth-child(3), #captable td:nth-child(3), #captable th:nth-child(4), #captable td:nth-child(4) { display: none; }
    #captable td.desc { max-width: 160px; }
    .searchbar input[type=text]#creg { width: 100%; }
  }

  /* trust view */
  .pad { padding: 16px; }
  .pad h3 { margin: 18px 0 8px; font-size: 13px; }
  .pad h3:first-child { margin-top: 0; }
  label.check-row { display: flex; gap: 8px; align-items: flex-start; }
  .keyline { display: flex; gap: 8px; align-items: center; }
  .keyline .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }

  /* dialogs and toasts */
  #modal-root { position: fixed; inset: 0; pointer-events: none; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 11, 20, .6); display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; pointer-events: auto; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: min(560px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.5); margin-bottom: 8vh; }
  .modal header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .modal .mbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .modal footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .modal footer .mprogress { margin-right: auto; color: var(--yellow); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .formrow { display: flex; flex-direction: column; gap: 3px; }
  .formrow > label { color: var(--dim); font-size: 11px; }
  .formrow input[type=text], .formrow select { width: 100%; }
  .asks { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .asks .line { display: flex; gap: 8px; }
  .asks .k { color: var(--dim); width: 70px; flex: none; }
  .err { color: var(--red); white-space: pre-wrap; word-break: break-word; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; max-width: 420px; pointer-events: none; }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; pointer-events: auto; word-break: break-word; }
  .toast.ok { border-left-color: var(--green); } .toast.error { border-left-color: var(--red); }
</style>
</head>
<body>
  <div id="sidebar">
    <div class="brand"><span class="dot"></span> elpis</div>
    <div id="vmlist"></div>
    <div class="sidefoot">
      <div><button id="refresh" style="width:100%">Rescan work folders</button></div>
      <div id="shimline" style="margin-top:8px"></div>
    </div>
  </div>

  <div id="main">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="box" class="active">Box</button>
      <button role="tab" data-view="capsules">Capsules</button>
      <button role="tab" data-view="trust">Trust &amp; keys</button>
    </nav>

    <section id="view-box" class="view">
      <div class="toolbar">
        <h2 id="title">Select a VM</h2>
        <label class="field" title="Windows 127.0.0.1 port the container can reach (e.g. Ollama 11434)">
          host&#8209;port <input type="text" id="hostport" value="11434" />
        </label>
        <button id="start" class="primary" disabled>Start</button>
        <button id="stop" class="danger" disabled>Stop</button>
        <button id="term" disabled>Terminal&#8230;</button>
        <button id="agent" disabled title="Open the box's agent (a kit's or Capsule's entrypoint) in a terminal">Agent&#8230;</button>
        <button id="clear" title="Clear the log view">Clear</button>
      </div>
      <div id="log"><div class="empty">Pick a VM on the left, then Start.</div></div>
    </section>

    <section id="view-capsules" class="view" hidden>
      <div class="searchbar">
        <input type="text" class="q" id="cq" placeholder="Search Capsules by name or description" aria-label="Search" />
        <select id="cscope" aria-label="Where to search">
          <option value="store">My Capsules</option>
          <option value="registry">A registry</option>
        </select>
        <input type="text" id="creg" placeholder="registry.example.com/team" aria-label="Registry" hidden style="width:220px" />
        <button id="csearch">Search</button>
        <span style="flex:1"></span>
        <button id="cbuild" title="Build a Capsule folder (with capsule.yaml) into your store">Build&#8230;</button>
        <button id="cpull" title="Download a Capsule from a registry">Pull&#8230;</button>
        <button id="crefresh" title="Re-read the store and re-check every Capsule">Refresh</button>
      </div>
      <div class="progress" id="cprogress"></div>
      <div class="split">
        <div id="captable" class="scroll"></div>
        <div id="capdetail" class="scroll"></div>
      </div>
    </section>

    <section id="view-trust" class="view scroll" hidden>
      <div class="pad" id="trustview"></div>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
